name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sagara
          POSTGRES_PASSWORD: sagara
          POSTGRES_DB: sagara_denim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagara -d sagara_denim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim
      TEST_DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim_test
      JWT_SECRET: ci-only-secret-yang-cukup-panjang-untuk-pengujian
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Buat database uji
        env:
          PGPASSWORD: sagara
        run: >-
          psql -h localhost -U sagara -d sagara_denim
          -c "CREATE DATABASE sagara_denim_test OWNER sagara;"

      - name: Pasang dependency
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Audit dependency Python
        working-directory: backend
        run: python -m pip_audit

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tes backend
        working-directory: backend
        run: pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency
        working-directory: frontend
        run: npm ci

      - name: Audit dependency produksi
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Tes unit
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sagara
          POSTGRES_PASSWORD: sagara
          POSTGRES_DB: sagara_denim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagara -d sagara_denim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim
      TEST_DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim_test
      JWT_SECRET: ci-only-secret-yang-cukup-panjang-untuk-pengujian
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrasi dan seed database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Jalankan API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API tidak siap setelah $attempt percobaan." >&2
          cat uvicorn.log
          exit 1

      - name: Pasang dependency frontend
        working-directory: frontend
        run: npm ci

      - name: Pasang browser Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Jalankan smoke test E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Simpan artefak E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  images:
    name: Image Build & Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bangun image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: sagara-denim-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Bangun image frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          platforms: linux/amd64
          load: true
          tags: sagara-denim-frontend:ci
          build-args: |
            API_PROXY_URL=http://backend:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan kerentanan backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sagara-denim-backend:ci
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan kerentanan frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sagara-denim-frontend:ci
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Validasi konfigurasi Compose
        run: |
          cp deploy/.env.production.example .env.ci
          docker compose --env-file .env.ci -f deploy/compose.prod.yml config --quiet
          docker compose --env-file .env.ci -f deploy/compose.prod.yml -f deploy/compose.local.yml config --quiet
          rm -f .env.ci

      - name: Validasi Caddyfile
        run: |
          docker run --rm \
            -e SAGARA_DOMAIN=sagara.example.com \
            -e ACME_EMAIL=admin@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e SAGARA_DOMAIN=sagara.localhost \
            -v "$PWD/deploy/Caddyfile.local:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

  backup-drill:
    name: Backup & Restore Drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [images]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Bangun image backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: sagara-denim-backend:ci
          cache-from: type=gha,scope=backend

      - name: Latihan backup dan restore
        run: |
          set -euo pipefail
          network=sagara-drill
          db=sagara-drill-db
          cleanup() {
            docker rm -f "$db" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$network"
          docker run -d --name "$db" --network "$network" \
            -e POSTGRES_USER=sagara \
            -e POSTGRES_PASSWORD=sagara \
            -e POSTGRES_DB=sagara_denim \
            postgres:17-alpine

          for attempt in $(seq 1 30); do
            if docker exec "$db" pg_isready -U sagara -d sagara_denim >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Database drill tidak siap." >&2
              docker logs "$db"
              exit 1
            fi
            sleep 1
          done

          docker run --rm --network "$network" \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://sagara:sagara@"$db":5432/sagara_denim \
            -e JWT_SECRET=ci-backup-drill-secret-yang-cukup-panjang \
            sagara-denim-backend:ci alembic upgrade head

          docker run --rm --network "$network" \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=postgresql+asyncpg://sagara:sagara@"$db":5432/sagara_denim \
            -e JWT_SECRET=ci-backup-drill-secret-yang-cukup-panjang \
            sagara-denim-backend:ci python -m app.seed

          users_before="$(docker exec "$db" psql -U sagara -d sagara_denim -tAc 'SELECT count(*) FROM users')"
          orders_before="$(docker exec "$db" psql -U sagara -d sagara_denim -tAc 'SELECT count(*) FROM production_orders')"

          mkdir -p backups
          docker run --rm --network "$network" --user 0:0 \
            -v "$PWD/backend/scripts:/scripts:ro" \
            -v "$PWD/backups:/backups" \
            -e BACKUP_DATABASE_URL=postgresql://sagara:sagara@"$db":5432/sagara_denim \
            -e BACKUP_DIR=/backups \
            -e BACKUP_METRICS_DIR=/backups/metrics \
            --entrypoint /bin/sh \
            postgres:17-alpine /scripts/backup_db.sh

          dump="$(basename "$(find backups -maxdepth 1 -name '*.dump' | head -n 1)")"
          test -n "$dump"
          test -f "backups/$dump.sha256"
          grep -q "sagara_backup_last_success_timestamp_seconds" backups/metrics/sagara_backup.prom

          docker run --rm --network "$network" --user 0:0 \
            -v "$PWD/backend/scripts:/scripts:ro" \
            -v "$PWD/backups:/backups" \
            -e RESTORE_ADMIN_URL=postgresql://sagara:sagara@"$db":5432/postgres \
            --entrypoint /bin/sh \
            postgres:17-alpine /scripts/verify_restore.sh "/backups/$dump"

          docker exec "$db" createdb -U sagara sagara_denim_staging

          docker run --rm --network "$network" --user 0:0 \
            -v "$PWD/backend/scripts:/scripts:ro" \
            -v "$PWD/backups:/backups" \
            -e RESTORE_DATABASE_URL=postgresql://sagara:sagara@"$db":5432/sagara_denim_staging \
            --entrypoint /bin/sh \
            postgres:17-alpine /scripts/restore_db.sh "/backups/$dump"

          users_after="$(docker exec "$db" psql -U sagara -d sagara_denim_staging -tAc 'SELECT count(*) FROM users')"
          orders_after="$(docker exec "$db" psql -U sagara -d sagara_denim_staging -tAc 'SELECT count(*) FROM production_orders')"
          echo "users: $users_before -> $users_after"
          echo "orders: $orders_before -> $orders_after"
          test "$users_after" = "$users_before"
          test "$orders_after" = "$orders_before"
          test "$users_after" -ge 3
