name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sagara
          POSTGRES_PASSWORD: sagara
          POSTGRES_DB: sagara_denim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagara -d sagara_denim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim
      TEST_DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim_test
      JWT_SECRET: ci-only-secret-yang-cukup-panjang-untuk-pengujian
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Buat database uji
        env:
          PGPASSWORD: sagara
        run: >-
          psql -h localhost -U sagara -d sagara_denim
          -c "CREATE DATABASE sagara_denim_test OWNER sagara;"

      - name: Pasang dependency
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Audit dependency Python
        working-directory: backend
        run: python -m pip_audit

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tes backend
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency
        working-directory: frontend
        run: npm ci

      - name: Audit dependency produksi
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sagara
          POSTGRES_PASSWORD: sagara
          POSTGRES_DB: sagara_denim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sagara -d sagara_denim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim
      TEST_DATABASE_URL: postgresql+asyncpg://sagara:sagara@localhost:5432/sagara_denim_test
      JWT_SECRET: ci-only-secret-yang-cukup-panjang-untuk-pengujian
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Siapkan Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Siapkan Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang dependency backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Migrasi dan seed database
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Jalankan API
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat uvicorn.log
          exit 1

      - name: Pasang dependency frontend
        working-directory: frontend
        run: npm ci

      - name: Pasang browser Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Jalankan smoke test E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Simpan artefak E2E
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
