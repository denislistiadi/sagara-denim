name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            build-args: ""
          - image: frontend
            context: ./frontend
            build-args: |
              API_PROXY_URL=http://backend:8000
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalisasi nama image
        run: |
          echo "IMAGE_NAME=${REGISTRY}/$(echo '${{ github.repository }}/${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Siapkan Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Masuk ke GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Siapkan metadata image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Sagara Denim ${{ matrix.image }}
            org.opencontainers.image.description=Image rilis Sagara Denim (${{ matrix.image }})
            org.opencontainers.image.vendor=Sagara Denim
            org.opencontainers.image.licenses=SEE LICENSE IN LICENSE

      - name: Bangun dan dorong image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image rilis
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Ringkasan rilis
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "- Tag: \`${{ github.ref_name }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Image: \`${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}\`"
            echo "- SBOM dan provenance: melekat pada image di GHCR"
          } >> "$GITHUB_STEP_SUMMARY"
