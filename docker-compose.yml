services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sagara
      POSTGRES_PASSWORD: sagara
      POSTGRES_DB: sagara_denim
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagara -d sagara_denim"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://sagara:sagara@db:5432/sagara_denim
      TEST_DATABASE_URL: postgresql+asyncpg://sagara:sagara@db:5432/sagara_denim_test
      JWT_SECRET: ${JWT_SECRET:-dev-compose-secret-ganti-di-produksi-minimal-32}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
